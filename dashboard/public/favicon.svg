<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The LeadFlow wave, on its own.

    Colours are literal rather than the CSS variables the in-app LogoMark uses:
    a favicon is fetched as a standalone document and has no access to the
    page's custom properties.

    Strokes are heavier than the in-app mark (4.2 against 3.2) because this is
    read at 16px, where the app's weight thins out to nothing.
  -->
  <defs>
    <linearGradient id="wave" x1="4" y1="26" x2="28" y2="6">
      <stop offset="0%" stop-color="#20808D"/>
      <stop offset="100%" stop-color="#39C8C2"/>
    </linearGradient>
  </defs>
  <path d="M3 22c3.6-5 6.9-5 10.5 0s6.9 5 10.5 0"
        fill="none" stroke="url(#wave)" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M5.5 12c3.5-5 6.8-5 10.3 0s6.8 5 10.3 0"
        fill="none" stroke="url(#wave)" stroke-width="4.2" stroke-linecap="round" opacity="0.55"/>
</svg>
